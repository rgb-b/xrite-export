[package]
name = "ink-density-tool"
version = "0.1.0"
edition = "2021"
description = "CMYK ink density recording tool for print professionals"

[features]
web = ["dep:axum", "dep:tokio"]

[dependencies]
# Web server (optional — enable with --features web)
axum  = { version = "0.7", optional = true }
tokio = { version = "1",   features = ["full"], optional = true }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Platform directories (%APPDATA%, ~/.config, etc.)
dirs = "6"

# Temp files (session round-trip tests)
tempfile = "3"

# Error handling
anyhow = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# Lazy statics
once_cell = "1"
